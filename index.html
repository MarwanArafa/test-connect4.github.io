<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect 4 — Professional Edition</title>
<style>
/* ============ THEME TOKENS ============ */
:root {
  color-scheme: dark;
  --bg1: #101522;
  --bg2: #1a2540;
  --bg-glow: rgba(124,108,255,.19);
  --panel: rgba(25,33,53,.88);
  --panel-solid: #1b2439;
  --panel-border: rgba(190,202,231,.14);
  --panel-border-hi: rgba(190,202,231,.28);
  --ink: #f2f5fc;
  --mute: #a5afc5;
  --field: #151d30;
  --field-hover: #202b43;
  --status-bg: rgba(124,108,255,.12);
  --board: #f4b51e;
  --board-edge: #c78d08;
  --board-hi: #ffda65;
  --x: #ff515b;
  --x-dark: #bf2738;
  --o: #4c87ff;
  --o-dark: #204fc5;
  --hole: #101725;
  --accent: #7568ff;
  --accent-2: #4d83ff;
  --radius: 22px;
  --shadow: 0 22px 54px rgba(0,0,0,.22);
  --focus: #76a5ff;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg1: #eef1fb;
  --bg2: #f8f9fe;
  --bg-glow: rgba(113,102,255,.14);
  --panel: rgba(255,255,255,.92);
  --panel-solid: #fff;
  --panel-border: rgba(47,58,92,.10);
  --panel-border-hi: rgba(47,58,92,.20);
  --ink: #202941;
  --mute: #66718b;
  --field: #f7f8fc;
  --field-hover: #eef1fa;
  --status-bg: #f0efff;
  --hole: #e4e8f3;
  --shadow: 0 18px 48px rgba(48,60,112,.11);
  --focus: #4d65e8;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg1: #eef1fb;
    --bg2: #f8f9fe;
    --bg-glow: rgba(113,102,255,.14);
    --panel: rgba(255,255,255,.92);
    --panel-solid: #fff;
    --panel-border: rgba(47,58,92,.10);
    --panel-border-hi: rgba(47,58,92,.20);
    --ink: #202941;
    --mute: #66718b;
    --field: #f7f8fc;
    --field-hover: #eef1fa;
    --status-bg: #f0efff;
    --hole: #e4e8f3;
    --shadow: 0 18px 48px rgba(48,60,112,.11);
    --focus: #4d65e8;
  }
}

* { box-sizing: border-box; }
html { min-height: 100%; }
body { margin: 0; min-height: 100vh; }
body {
  display: flex;
  justify-content: center;
  padding: clamp(18px, 4vw, 42px) 16px 44px;
  color: var(--ink);
  background:
    radial-gradient(900px 560px at 8% -8%, var(--bg-glow), transparent 62%),
    radial-gradient(820px 480px at 105% 8%, rgba(61,123,255,.10), transparent 58%),
    linear-gradient(155deg, var(--bg1), var(--bg2));
  background-attachment: fixed;
  font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
main { width: 100%; max-width: 790px; }

/* ============ HEADER ============ */
header { text-align: center; margin: 0 0 24px; }
header h1 {
  display: inline-block;
  margin: 0;
  font-size: clamp(2rem, 6vw, 3rem);
  line-height: 1.08;
  letter-spacing: -.055em;
  font-weight: 900;
  background: linear-gradient(100deg, #e9a916 5%, #7468f5 53%, #3477ee 95%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
}
header p { margin: 9px 0 0; color: var(--mute); font-size: clamp(.9rem, 2.4vw, 1.03rem); letter-spacing: .015em; }

/* ============ PANELS & CONTROLS ============ */
.panel {
  margin: 0 0 16px;
  padding: clamp(16px, 3vw, 24px);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius);
  background: var(--panel);
  box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
}
.row { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; align-items: center; }
.row + .row { margin-top: 12px; }
label {
  color: var(--mute);
  font-size: .76rem;
  font-weight: 800;
  letter-spacing: .095em;
  text-transform: uppercase;
}
select, button {
  box-sizing: border-box;
  min-width: 0;
  min-height: 48px;
  border: 1px solid var(--panel-border-hi);
  border-radius: 13px;
  padding: 10px 14px;
  font: inherit;
  line-height: 1.25;
  color: var(--ink);
  background: var(--field);
  -webkit-text-fill-color: var(--ink);
  opacity: 1;
  transition: border-color .16s ease, background .16s ease, box-shadow .16s ease, transform .12s ease;
}
select { width: min(100%, 430px); cursor: pointer; }
select:hover, button:hover { border-color: var(--panel-border-hi); background-color: var(--field-hover); }
button { display: inline-flex; justify-content: center; align-items: center; gap: 8px; font-weight: 700; cursor: pointer; -webkit-appearance: none; appearance: none; }
button:active { transform: translateY(1px) scale(.985); }
button:disabled { cursor: not-allowed; opacity: .6; }
.settings-panel .row:last-child { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; }
.settings-panel button.go,
:root[data-theme="light"] .settings-panel button.go {
  color: #fff;
  -webkit-text-fill-color: #fff;
  background: linear-gradient(120deg, #7060ed, #397ff4);
  border: 1px solid transparent;
  box-shadow: 0 8px 20px rgba(78,103,234,.28);
  font-weight: 800;
}
.settings-panel button.go:hover { background: linear-gradient(120deg, #6252df, #286ce4); box-shadow: 0 10px 24px rgba(78,103,234,.36); }
#newGame { min-width: 160px; }
#theme { margin-left: auto; background: var(--panel-solid); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

/* ============ SCOREBOARD ============ */
.score { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
.score .card {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 15px;
  border: 1px solid var(--panel-border);
  border-radius: 16px;
  background: var(--panel-solid);
  font-weight: 750;
  transition: box-shadow .2s ease, border-color .2s ease, transform .2s ease;
}
.score .card .dot { width: 16px; height: 16px; border-radius: 50%; flex: 0 0 auto; box-shadow: inset 0 -3px 5px rgba(0,0,0,.24); }
.score .card.x .dot { background: var(--x); }
.score .card.o .dot { background: var(--o); }
.score .card .name { overflow: hidden; color: var(--mute); font-size: .88rem; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
.score .card .val { margin-left: auto; font-size: 1.55rem; line-height: 1; font-weight: 900; font-variant-numeric: tabular-nums; }
.score .card.x .val { color: var(--x); }
.score .card.o .val { color: var(--o); }
.score .card.turn { transform: translateY(-2px); border-color: currentColor; }
.score .card.x.turn { box-shadow: 0 0 0 2px rgba(255,81,91,.16), 0 8px 22px rgba(255,81,91,.10); }
.score .card.o.turn { box-shadow: 0 0 0 2px rgba(76,135,255,.16), 0 8px 22px rgba(76,135,255,.10); }

/* ============ STATUS & BOARD ============ */
.status {
  min-height: 48px;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 0 0 14px;
  padding: 10px 14px;
  border-radius: 14px;
  background: var(--status-bg);
  color: var(--ink);
  text-align: center;
  font-weight: 800;
  font-size: clamp(.94rem, 2.5vw, 1.06rem);
}
.status:empty { display: none; }
.status.pulse { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .62; } }
.hints { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 7px; padding: 0 10px; margin-bottom: 3px; }
.hint { text-align: center; font-size: 1.1rem; line-height: 1.1; color: transparent; user-select: none; transition: color .12s, transform .12s; }
.hint.on { transform: translateY(2px); }
.hint.on.X { color: var(--x); filter: drop-shadow(0 0 5px rgba(255,81,91,.45)); }
.hint.on.O { color: var(--o); filter: drop-shadow(0 0 5px rgba(76,135,255,.5)); }
.board {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  grid-template-rows: minmax(0, 1fr);
  gap: clamp(4px, 1vw, 8px);
  padding: clamp(7px, 1.4vw, 12px);
  border: 1px solid rgba(255,255,255,.22);
  border-radius: clamp(16px, 3vw, 24px);
  /* Keep the full 7×6 game grid visible. Without a board ratio, the
     global button min-height can collapse each column's six grid rows. */
  aspect-ratio: 7 / 6;
  background: linear-gradient(180deg, var(--board-hi), var(--board) 34%, var(--board-edge));
  box-shadow: 0 16px 30px rgba(18,25,45,.20), inset 0 2px 0 rgba(255,255,255,.42);
  position: relative;
}
.col {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: repeat(6, minmax(0, 1fr));
  min-width: 0;
  min-height: 0;
  height: 100%;
  align-items: stretch;
  gap: clamp(4px, 1vw, 8px);
  padding: 0;
  border: 0;
  border-radius: 12px;
  background: transparent;
  -webkit-text-fill-color: transparent;
  cursor: pointer;
  transition: background .12s ease;
}
.col:hover:not(:disabled), .col:focus-visible { background: rgba(65,72,110,.16); }
.col:disabled { cursor: default; opacity: 1; }
.cell { width: 100%; aspect-ratio: 1; border-radius: 50%; background: var(--hole); box-shadow: inset 0 4px 8px rgba(0,0,0,.22), inset 0 -1px 2px rgba(0,0,0,.14); transition: background .15s; }
.cell.X { background: radial-gradient(circle at 35% 27%, #ff9da1, var(--x) 48%, var(--x-dark)); box-shadow: inset 0 -5px 8px rgba(0,0,0,.24), 0 2px 5px rgba(0,0,0,.22); }
.cell.O { background: radial-gradient(circle at 35% 27%, #a4c5ff, var(--o) 48%, var(--o-dark)); box-shadow: inset 0 -5px 8px rgba(0,0,0,.24), 0 2px 5px rgba(0,0,0,.22); }
.cell.new { animation: drop .3s cubic-bezier(.3,.9,.4,1.15); }
.cell.win { outline: 3px solid rgba(255,255,255,.95); outline-offset: -4px; animation: winpulse .9s ease-in-out infinite; }
@keyframes drop { from { transform: translateY(-280%) scale(.85); } to { transform: none; } }
@keyframes winpulse { 0%,100% { outline-color: rgba(255,255,255,.95); } 50% { outline-color: rgba(255,255,255,.35); } }
.note { margin: 16px 0 0; color: var(--mute); text-align: center; font-size: .84rem; }

@media (max-width: 540px) {
  body { padding: 20px 10px 28px; }
  header { margin-bottom: 18px; }
  .panel { padding: 14px; border-radius: 18px; }
  .row { grid-template-columns: 1fr; gap: 7px; }
  .row + .row { margin-top: 13px; }
  label { font-size: .72rem; }
  select { width: 100%; max-width: none; min-height: 46px; }
  .settings-panel .row:last-child { flex-direction: row; align-items: stretch; }
  #newGame { min-width: 0; flex: 1; }
  #theme { margin-left: 0; }
  .score { gap: 8px; margin-bottom: 14px; }
  .score .card { padding: 11px 10px; gap: 7px; }
  .score .card .dot { width: 13px; height: 13px; }
  .score .card .name { font-size: .78rem; }
  .score .card .val { font-size: 1.35rem; }
  .hints { gap: 4px; padding: 0 6px; }
  .board { gap: 4px; padding: 7px; }
  .col { gap: 4px; border-radius: 8px; }
  .cell { box-shadow: inset 0 2px 5px rgba(0,0,0,.22); }
}
@media (max-width: 360px) {
  .settings-panel .row:last-child { flex-direction: column; }
  #theme { width: 100%; }
  .score .card .name { font-size: .72rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

</style>
<base target="_blank">
</head>
<body>
<main>
<header>
  <h1>CONNECT 4</h1>
  <p>Professional Edition — outsmart the machine</p>
</header>
<section class="panel settings-panel" aria-label="Game settings">
  <div class="row"><label for="mode">Mode</label>
    <select id="mode"><option value="1">Classic (first to 4 wins)</option><option value="2">Score Attack (most lines when full)</option></select></div>
  <div class="row"><label for="opp">Opponent</label>
    <select id="opp"><option value="2">Human vs AI</option><option value="1">Human vs Human</option></select></div>
  <div class="row" id="diffRow"><label for="diff">Difficulty</label>
    <select id="diff"><option value="2">Easy (depth 2)</option><option value="4">Medium (depth 4)</option><option value="6" selected>Hard (depth 6)</option><option value="7">Expert (depth 7)</option></select></div>
  <div class="row" id="firstRow"><label for="first">First move</label>
    <select id="first"><option value="you">You start (Red)</option><option value="ai">AI starts (Blue)</option><option value="random">Random</option></select></div>
  <div class="row"><button class="go" id="newGame">⟳ New game</button><button id="theme" aria-label="Switch light or dark theme">◐ Theme</button></div>
</section>
<section class="panel game-panel" aria-label="Game board">
  <div class="score">
    <div class="card x" id="cardX"><span class="dot"></span><span class="name" id="n1">Red</span><span class="val" id="s1">0</span></div>
    <div class="card o" id="cardO"><span class="dot"></span><span class="name" id="n2">Blue (AI)</span><span class="val" id="s2">0</span></div>
  </div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <div class="hints" id="hints"></div>
  <div class="board" id="board"></div>
  <p class="note" id="note">You are Red. Click a column (or use ← → then Enter) to drop a piece.</p>
</section>
</main>
<script>
/* ---------- AI ENGINE (runs in a Web Worker so the page never freezes) ---------- */
function engineMain(){
  const R=6,C=7,MAXTT=2000000;
  let tt=new Map(),SA=false;
  const nextRow=(b,c)=>{for(let r=R-1;r>=0;r--)if(b[r][c]===' ')return r;return -1};
  const D=[[0,1],[1,0],[1,1],[1,-1]];
  function win(b,p){
    for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(const[dr,dc]of D){
      const er=r+3*dr,ec=c+3*dc;if(er<0||er>=R||ec<0||ec>=C)continue;
      if(b[r][c]===p&&b[r+dr][c+dc]===p&&b[r+2*dr][c+2*dc]===p&&b[er][ec]===p)return true}
    return false}
  // Score Attack: each maximal run of 4+ counts once (look-behind check)
  function lines(b,p){
    let s=0;
    for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(const[dr,dc]of D){
      const er=r+3*dr,ec=c+3*dc;if(er<0||er>=R||ec<0||ec>=C)continue;
      if(b[r][c]!==p||b[r+dr][c+dc]!==p||b[r+2*dr][c+2*dc]!==p||b[er][ec]!==p)continue;
      const pr=r-dr,pc=c-dc;
      if(pr<0||pr>=R||pc<0||pc>=C||b[pr][pc]!==p)s++}
    return s}
  function evalWindow(w,p){
    let cp=0,ce=0;for(const x of w){if(x===p)cp++;else if(x===' ')ce++}
    const co=4-cp-ce;let s=0;
    if(cp===4)return SA?0:1000000;
    if(cp===3&&ce===1){s+=(w[0]===' '&&w[3]===' ')?5000:150}
    else if(cp===2&&ce===2){const con=(w[0]===p&&w[1]===p)||(w[1]===p&&w[2]===p)||(w[2]===p&&w[3]===p);s+=con?50:60}
    if(co===3&&ce===1){s-=(w[0]===' '&&w[3]===' ')?10000:500}
    else if(co===2&&ce===2)s-=50;
    return s}
  function evalBoard(b,p){
    let s=0;
    for(let r=0;r<R;r++){if(b[r][3]===p)s+=200;if(b[r][2]===p||b[r][4]===p)s+=100}
    for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(const[dr,dc]of D){
      const er=r+3*dr,ec=c+3*dc;if(er<0||er>=R||ec<0||ec>=C)continue;
      s+=evalWindow([b[r][c],b[r+dr][c+dc],b[r+2*dr][c+2*dc],b[er][ec]],p)}
    return s}
  const saEval=b=>(lines(b,'O')-lines(b,'X'))*1000000+evalBoard(b,'O');
  function countThreats(b,p){
    let t=0;for(let c=0;c<C;c++){const r=nextRow(b,c);if(r<0)continue;b[r][c]=p;if(win(b,p))t++;b[r][c]=' '}return t}
  function ordered(b,max){
    const p=max?'O':'X',m=[];
    for(let c=0;c<C;c++){
      const r=nextRow(b,c);if(r<0)continue;
      b[r][c]=p;let s=win(b,p)?1000000:evalBoard(b,p);b[r][c]=' ';
      s+=30-Math.abs(c-3)*10;
      if(r<R-1&&b[r+1][c]===p)s+=40;
      m.push([c,s])}
    m.sort((a,b)=>b[1]-a[1]);return m.map(x=>x[0])}
  function adaptive(b,base){
    const t=countThreats(b,'O')+countThreats(b,'X');
    if(t>=2)return base+2;if(t===1)return base+1;
    let n=0;for(const row of b)for(const v of row)if(v!==' ')n++;
    if(n<8)return Math.max(3,base-1);if(n>30)return base+1;return base}
  function minimax(b,depth,alpha,beta,max,orig){
    if(!SA){if(win(b,'O'))return[-1,1000000+depth];if(win(b,'X'))return[-1,-1000000-depth]}
    let empty=0;for(const row of b)for(const v of row)if(v===' ')empty++;
    if(!SA&&empty<=orig*2)depth=empty;
    if(depth===0)return[-1,SA?saEval(b):evalBoard(b,'O')];
    const moves=ordered(b,max);
    if(!moves.length)return[-1,SA?saEval(b):0];
    const key=b.map(r=>r.join('')).join('')+(max?'T':'F');
    const a0=alpha,b0=beta,e=tt.get(key);
    if(e&&e.d>=depth){
      if(e.f===0)return[e.c,e.s];
      if(e.f===1)alpha=Math.max(alpha,e.s);else beta=Math.min(beta,e.s);
      if(alpha>=beta)return[e.c,e.s]}
    let best=max?-Infinity:Infinity,bc=moves[0];
    for(const c of moves){
      const r=nextRow(b,c);b[r][c]=max?'O':'X';
      const s=minimax(b,depth-1,alpha,beta,!max,orig)[1];
      b[r][c]=' ';
      if(max?s>best:s<best){best=s;bc=c}
      if(max)alpha=Math.max(alpha,best);else beta=Math.min(beta,best);
      if(alpha>=beta)break}
    const f=best<=a0?2:best>=b0?1:0; // 0 exact, 1 lower bound, 2 upper bound
    if(tt.size>=MAXTT)tt.clear();
    tt.set(key,{d:depth,s:best,c:bc,f});
    return[bc,best]}
  function choose(b,base,sa){
    SA=sa;const d=adaptive(b,base);
    if(!sa){
      // 1) take a winning move, 2) otherwise block the opponent's win
      for(const p of['O','X'])for(let c=0;c<C;c++){
        const r=nextRow(b,c);if(r<0)continue;
        b[r][c]=p;const w=win(b,p);b[r][c]=' ';if(w)return c}}
    let col=minimax(b.map(r=>r.slice()),d,-Infinity,Infinity,true,d)[0];
    if(col<0)for(let c=0;c<C;c++)if(nextRow(b,c)>=0){col=c;break}
    return col}
  return{choose,reset:()=>tt.clear()}
}


/* ---------- UI ---------- */
const R=6,C=7,$=id=>document.getElementById(id);
let worker=null,local=null;
try{
  worker=new Worker(URL.createObjectURL(new Blob(['const engineMain='+engineMain+';const api=engineMain();onmessage=e=>{if(e.data.reset){api.reset();return}postMessage({col:api.choose(e.data.board,e.data.depth,e.data.sa),id:e.data.id})}'],{type:'text/javascript'})));
  worker.onmessage=e=>onAI(e.data);
  worker.onerror=()=>{worker=null};
}catch(err){worker=null}
// Falls back to running the engine on the main thread if Workers are blocked (e.g. sandboxed previews)
function send(m){
  if(worker){worker.postMessage(m);return}
  if(!local)local=engineMain();
  if(m.reset){local.reset();return}
  setTimeout(()=>onAI({col:local.choose(m.board,m.depth,m.sa),id:m.id}),0)}
let board,cur,over,moves,sa,vsAI,depth,busy,gameId=0,lastMove=null,winCells=[];
const D=[[0,1],[1,0],[1,1],[1,-1]];
function findFour(b,p){
  for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(const[dr,dc]of D){
    const er=r+3*dr,ec=c+3*dc;if(er<0||er>=R||ec<0||ec>=C)continue;
    if([0,1,2,3].every(k=>b[r+k*dr][c+k*dc]===p))return[0,1,2,3].map(k=>[r+k*dr,c+k*dc])}
  return null}
function countLines(b,p){
  let s=0;
  for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(const[dr,dc]of D){
    const er=r+3*dr,ec=c+3*dc;if(er<0||er>=R||ec<0||ec>=C)continue;
    if(![0,1,2,3].every(k=>b[r+k*dr][c+k*dc]===p))continue;
    const pr=r-dr,pc=c-dc;
    if(pr<0||pr>=R||pc<0||pc>=C||b[pr][pc]!==p)s++}
  return s}
const nextRow=c=>{for(let r=R-1;r>=0;r--)if(board[r][c]===' ')return r;return -1};
const humanTurn=()=>!over&&!busy&&(!vsAI||cur==='X');

function turnText(){
  if(over)return '';
  const who=cur==='X'?'Red':'Blue';
  if(vsAI)return cur==='X'?'Your turn — click a column':'AI is thinking...';
  return who+' to move'}
function renderHints(){
  const h=$('hints');h.innerHTML='';
  for(let c=0;c<C;c++){
    const d=document.createElement('div');
    d.className='hint';
    d.textContent='▼';
    h.appendChild(d)}}
function showHint(c){
  renderHints();
  if(!humanTurn()||nextRow(c)<0)return;
  const d=$('hints').children[c];
  d.className='hint on '+cur}

function render(){
  const el=$('board');el.innerHTML='';
  for(let c=0;c<C;c++){
    const b=document.createElement('button');
    b.className='col';b.setAttribute('aria-label','Drop in column '+(c+1));
    b.disabled=!humanTurn()||nextRow(c)<0;
    b.onclick=()=>humanMove(c);
    b.onmouseenter=()=>showHint(c);
    b.onmouseleave=()=>renderHints();
    b.onfocus=()=>showHint(c);
    b.onblur=()=>renderHints();
    for(let r=0;r<R;r++){
      const d=document.createElement('div');
      d.className='cell'+(board[r][c]!==' '?' '+board[r][c]:'');
      if(lastMove&&lastMove[0]===r&&lastMove[1]===c)d.classList.add('new');
      if(winCells.some(w=>w[0]===r&&w[1]===c))d.classList.add('win');
      b.appendChild(d)}
    el.appendChild(b)}
  renderHints();
  const s1=sa?countLines(board,'X'):(over&&findFour(board,'X')?1:0);
  const s2=sa?countLines(board,'O'):(over&&findFour(board,'O')?1:0);
  $('s1').textContent=s1;
  $('s2').textContent=s2;
  $('n1').textContent='Red';
  $('n2').textContent=vsAI?'Blue (AI)':'Blue';
  $('cardX').classList.toggle('turn',!over&&cur==='X');
  $('cardO').classList.toggle('turn',!over&&cur==='O');
  $('note').textContent=vsAI?'You are Red. Click a column (or use ← → then Enter) to drop a piece.':'Red moves first. Click a column to drop a piece.'}
function setStatus(t){
  $('status').textContent=t;
  $('status').classList.toggle('pulse',t==='AI is thinking...'||t.indexOf('starts')>=0)}

function newGame(){
  gameId++;send({reset:true});
  board=Array.from({length:R},()=>Array(C).fill(' '));
  over=false;moves=0;busy=false;lastMove=null;winCells=[];
  sa=$('mode').value==='2';vsAI=$('opp').value==='2';depth=+$('diff').value;
  $('diffRow').style.display=vsAI?'flex':'none';
  $('firstRow').style.display=vsAI?'flex':'none';
  const first=$('first').value;
  const aiStarts=vsAI&&(first==='ai'||(first==='random'&&Math.random()<0.5));
  cur=aiStarts?'O':'X';
  render();
  if(aiStarts){setStatus('AI (Blue) starts...');aiTurn()}
  else setStatus(turnText())}

function place(c){
  const r=nextRow(c);if(r<0)return false;
  board[r][c]=cur;moves++;lastMove=[r,c];
  if(!sa){
    const w=findFour(board,cur);
    if(w){over=true;winCells=w;render();
      setStatus(cur==='X'?'🎉 Red wins!':(vsAI?'🤖 The AI wins!':'🎉 Blue wins!'));return true}}
  if(moves>=R*C){
    over=true;render();
    if(sa){const a=countLines(board,'X'),b=countLines(board,'O');
      setStatus(a>b?'Red wins '+a+' to '+b:b>a?(vsAI?'The AI wins ':'Blue wins ')+b+' to '+a:'Draw '+a+' to '+b)}
    else setStatus('Draw: the board is full');
    return true}
  cur=cur==='X'?'O':'X';return true}

function humanMove(c){
  if(!humanTurn())return;
  if(!place(c))return;
  render();
  if(over)return;
  if(vsAI&&cur==='O'){setStatus(turnText());aiTurn()}
  else setStatus(turnText())}

// Keyboard play: arrows move across columns, Enter/Space drops
document.addEventListener('keydown',e=>{
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight'&&e.key!=='Enter'&&e.key!==' ')return;
  if(!board||over||busy)return;
  const cols=[...document.querySelectorAll('.col')];
  if(!cols.length)return;
  const active=document.activeElement;
  let i=active&&active.classList.contains('col')?cols.indexOf(active):3;
  if(i<0)i=3;
  if(e.key==='ArrowLeft'){cols[Math.max(0,i-1)].focus();e.preventDefault()}
  else if(e.key==='ArrowRight'){cols[Math.min(C-1,i+1)].focus();e.preventDefault()}
  else if(active&&active.classList.contains('col')){active.click();e.preventDefault()}});

function aiTurn(){
  busy=true;render();
  const id=gameId;
  setTimeout(()=>send({board:board.map(r=>r.slice()),depth,sa,id}),30)}

function onAI(d){
  if(d.id!==gameId)return;
  busy=false;place(d.col);render();
  if(!over)setStatus(turnText())}

$('newGame').onclick=newGame;
['mode','opp','diff','first'].forEach(id=>$(id).onchange=newGame);
$('theme').onclick=()=>{
  const root=document.documentElement;
  const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  root.dataset.theme=dark?'light':'dark'};
newGame();
</script>
</body>
</html>
